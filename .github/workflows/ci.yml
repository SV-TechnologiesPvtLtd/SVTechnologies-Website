name: CI - Lint & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel duplicate runs for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with: 
          persist-credentials: false
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        
      - name: Install Dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit
      
      - name: Build Static Site
        run: npm run build
      
      - name: Upload Static Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-static-out
          path: out/

        

